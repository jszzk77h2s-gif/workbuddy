<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 奥特曼英语大闯关 · Ultraman English Quest · Fast Load</title>
<style>
/* ============ 奥特曼英语大闯关 —— 精致版 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body {
  font-family: "PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  background: linear-gradient(180deg, #0a0a1e 0%, #1a1040 30%, #0d1b3e 60%, #0a0a1e 100%);
  color:#fff; position:relative; user-select:none;
}

/* ===== 星空背景 ===== */
#stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.star { position:absolute; border-radius:50%; animation: twinkle 2.6s ease-in-out infinite; }
.star.w { background:#fff; box-shadow:0 0 6px rgba(255,255,255,.8); }
.star.b { background:#00E5FF; box-shadow:0 0 8px rgba(0,229,255,.9); }
.star.g { background:#FFD700; box-shadow:0 0 6px rgba(255,215,0,.8); }
.star.r { background:#E50012; box-shadow:0 0 6px rgba(229,0,18,.8); }
@keyframes twinkle { 0%,100%{opacity:.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.8)} }

/* ===== 屏幕切换 ===== */
.screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
  padding: max(16px, env(safe-area-inset-top)) 16px 20px; z-index:2; overflow-y:auto; }
.screen.active { display:flex; animation: pop-in .35s ease; }
@keyframes pop-in { from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)} }

/* ===== 奥特曼角色 SVG ===== */
.ultra-hero { position:relative; width:140px; height:160px; margin:8px auto 4px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.ultra-hero svg { width:100%; height:100%; filter:drop-shadow(0 0 20px rgba(0,229,255,.6)); }
.ultra-hero.small { animation:none; transform:scale(.55); margin:0 auto; }

/* ===== 首页 ===== */
.hero { text-align:center; }
.game-title { font-size:32px; line-height:1.3; font-weight:900;
  background: linear-gradient(135deg, #E50012 20%, #FFD700 50%, #E50012 80%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 15px rgba(229,0,18,.5)); letter-spacing:2px; }
.game-title span { font-size:22px; }
.subtitle { margin-top:4px; color:#00E5FF; font-size:13px; letter-spacing:3px; opacity:.85; }
.home-stats { display:flex; gap:12px; margin:18px 0 6px; }
.hs-item { background:rgba(0,229,255,.08); border:2px solid rgba(0,229,255,.35); border-radius:999px;
  padding:8px 16px; font-size:14px; color:#a8d8ff; }
.hs-item b { color:#00E5FF; font-size:17px; }

.big-btn {
  display:block; width:min(300px,84vw); margin:12px auto 0; padding:15px 0;
  font-size:20px; font-weight:800; color:#fff; border:none; border-radius:999px;
  cursor:pointer; letter-spacing:2px; position:relative;
  transition: transform .12s ease, box-shadow .2s;
}
.big-btn:active { transform:scale(.95); }
.btn-start {
  background:linear-gradient(180deg,#ff4444,#c8102e);
  box-shadow:0 5px 0 #7a0a1e, 0 0 25px rgba(229,0,18,.5), 0 8px 20px rgba(0,0,0,.4);
  animation: pulse-start 2.2s ease-in-out infinite;
}
@keyframes pulse-start {
  0%,100%{box-shadow:0 5px 0 #7a0a1e, 0 0 25px rgba(229,0,18,.5)}
  50%{box-shadow:0 5px 0 #7a0a1e, 0 0 45px rgba(229,0,18,.85), 0 0 70px rgba(0,229,255,.3)}
}
.btn-review {
  background:linear-gradient(180deg,#7B2FFF,#5a1fc0);
  box-shadow:0 5px 0 #3a1080, 0 0 20px rgba(123,47,255,.4), 0 8px 20px rgba(0,0,0,.4);
}
.review-badge {
  position:absolute; top:-8px; right:12px; min-width:26px; height:26px; padding:0 7px;
  background:#FFD700; color:#1a1a2e; border-radius:999px; font-size:13px; line-height:26px;
  display:none; font-weight:900;
}
.text-btn { margin-top:14px; background:none; border:none; color:#7fa8d0; font-size:15px; cursor:pointer; padding:8px; }
.credit { margin-top:auto; padding-top:14px; font-size:11px; color:rgba(255,255,255,.4); }

/* ===== 关卡选择 ===== */
.screen-title { font-size:22px; margin:8px 0 14px; color:#00E5FF; text-shadow:0 0 15px rgba(0,229,255,.5); }
.planet-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(400px,92vw); }
.planet-card {
  background:rgba(10,10,40,.7); border:2px solid rgba(0,229,255,.25);
  border-radius:20px; padding:16px 8px 12px; text-align:center; cursor:pointer;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
  backdrop-filter:blur(4px);
}
.planet-card:active { transform:scale(.94); }
.planet-card:hover, .planet-card:active { border-color:rgba(0,229,255,.6); box-shadow:0 0 20px rgba(0,229,255,.15); }
.planet-icon { font-size:40px; display:block;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)); animation: float 3.4s ease-in-out infinite; }
.planet-name { font-size:16px; font-weight:800; margin-top:6px; }
.planet-count { font-size:10px; color:rgba(168,216,255,.6); margin-top:3px; }
.planet-stars { margin-top:6px; font-size:12px; color:#FFD700; letter-spacing:2px; }

/* ===== 游戏页 ===== */
.hud { display:flex; align-items:center; gap:10px; width:min(500px,94vw); margin-bottom:8px; }
.hud-btn { width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; font-size:16px; cursor:pointer; flex:none; }
.hud-progress { flex:1; height:14px; background:rgba(0,0,0,.4); border-radius:999px; overflow:hidden; border:2px solid rgba(0,229,255,.4); }
.hud-bar { height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg,#00E5FF,#7B2FFF); transition:width .4s ease;
  box-shadow:0 0 10px rgba(0,229,255,.7); }
.hud-energy { font-size:15px; font-weight:800; color:#00E5FF; flex:none; }

.combo-tip { height:24px; font-size:15px; font-weight:900; color:#FFD700;
  text-shadow:0 0 12px rgba(255,215,0,.8); opacity:0; transition:opacity .2s; text-align:center; }
.combo-tip.show { opacity:1; animation: combo-pop .45s ease; }
@keyframes combo-pop { 0%{transform:scale(.5)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }

.quiz-card {
  width:min(500px,94vw); background:rgba(15,15,50,.95); color:#e0e8f0;
  border-radius:24px; padding:16px 14px 18px; position:relative;
  box-shadow:0 12px 36px rgba(0,0,0,.5), inset 0 0 0 2px rgba(0,229,255,.15);
  border:1px solid rgba(0,229,255,.2);
}
.quiz-question { font-size:18px; font-weight:700; text-align:center; padding:0 36px; color:#e8f0ff; line-height:1.4; }
.quiz-word-badge { display:inline-block; background:linear-gradient(135deg,#E50012,#ff4444); color:#fff;
  padding:4px 16px; border-radius:20px; font-size:15px; font-weight:900; margin:8px 0; letter-spacing:1px; }
.speak-btn {
  position:absolute; top:10px; right:10px; width:40px; height:40px; border-radius:50%;
  border:none; background:linear-gradient(180deg,#00E5FF,#0066CC); color:#fff; font-size:18px;
  cursor:pointer; box-shadow:0 3px 0 #004499, 0 0 15px rgba(0,229,255,.4);
  transition:transform .12s;
}
.speak-btn:active { transform:scale(.9); }
.speak-btn.speaking { animation:speak-glow .6s ease-in-out infinite; }
@keyframes speak-glow { 0%,100%{box-shadow:0 3px 0 #004499,0 0 15px rgba(0,229,255,.4)} 50%{box-shadow:0 3px 0 #004499,0 0 30px rgba(0,229,255,.9)} }

.quiz-image {
  margin:10px auto 4px; width:min(280px,68vw); height:min(210px,42vw);
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,rgba(0,229,255,.05),rgba(123,47,255,.05)); border-radius:16px;
  border:2px solid rgba(0,229,255,.2); overflow:hidden;
}
.quiz-image img { width:100%; height:100%; object-fit:contain; }
.quiz-image .fallback-emoji { font-size:min(100px,22vw); line-height:1;
  filter:drop-shadow(0 6px 12px rgba(0,229,255,.3)); animation: float 3s ease-in-out infinite; }

.options { display:flex; flex-direction:column; gap:9px; margin-top:12px; }
.opt-btn {
  position:relative; padding:13px 14px; font-size:17px; font-weight:700; text-align:center;
  border-radius:14px; border:2px solid rgba(0,229,255,.25); background:rgba(0,229,255,.06); color:#d0e0ff;
  cursor:pointer; transition: transform .12s ease, background .15s, border-color .15s;
}
.opt-btn:active { transform:scale(.97); }
.opt-btn .opt-tag { position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#E50012,#ff4444); color:#fff;
  font-size:13px; line-height:26px; font-weight:900; }
.opt-btn.correct { background:rgba(0,255,136,.15); border-color:#00FF88; color:#00FF88; animation: opt-win .5s ease; }
.opt-btn.correct .opt-tag { background:#00FF88; color:#1a2e1a; }
.opt-btn.wrong { background:rgba(229,0,18,.15); border-color:#E50012; color:#ff6666; animation: shake .4s ease; }
.opt-btn.wrong .opt-tag { background:#E50012; }
.opt-btn.dim { opacity:.4; pointer-events:none; }
@keyframes opt-win { 0%{transform:scale(1)} 45%{transform:scale(1.05)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-3px)} }

.answer-line { min-height:28px; margin-top:10px; text-align:center; font-size:15px; font-weight:700; color:#00E5FF; }
.answer-line .listen { cursor:pointer; text-decoration:underline dotted; }

/* 斯佩修姆光线特效 */
.beam-fx { position:fixed; left:0; right:0; top:0; bottom:0; pointer-events:none; z-index:8; display:none; }
.beam-fx.on { display:block; }
.beam-fx::before {
  content:""; position:absolute; left:-20%; top:42%; width:140%; height:14px;
  background:linear-gradient(90deg,transparent,#00E5FF,#fff,#00E5FF,transparent);
  box-shadow:0 0 40px #00E5FF, 0 0 100px #0066FF, 0 0 160px rgba(0,229,255,.5);
  animation: beam-shoot .55s ease-out forwards;
}
@keyframes beam-shoot { from{transform:scaleX(0); opacity:0} 25%{opacity:1} to{transform:scaleX(1); opacity:0} }

/* ===== 结算页 ===== */
.result-card {
  width:min(400px,90vw); margin:auto; background:rgba(10,10,40,.85);
  border:2px solid rgba(0,229,255,.3); border-radius:26px; padding:24px 18px; text-align:center;
  backdrop-filter: blur(8px); box-shadow:0 0 40px rgba(0,229,255,.1);
}
.result-card h2 { font-size:28px; margin:8px 0 4px; color:#FFD700; text-shadow:0 0 15px rgba(255,215,0,.5); }
.result-stars { font-size:36px; letter-spacing:6px; margin:4px 0; }
.result-stars .off { opacity:.2; filter:grayscale(1); }
.result-stats { display:flex; justify-content:center; gap:20px; margin:8px 0; font-size:15px; }
.result-stats b { color:#00E5FF; font-size:19px; }
.result-msg { font-size:13px; color:#a8d8ff; margin:4px 0 8px; line-height:1.5; }

#fxCanvas { position:fixed; inset:0; pointer-events:none; z-index:9; }

@media (min-width:700px){
  .game-title{ font-size:40px; }
  .planet-grid{ grid-template-columns:repeat(4,1fr); width:min(740px,94vw); }
}

.bgm-btn {
  position:fixed; bottom:80px; right:14px; width:44px; height:44px; border-radius:50%;
  border:2px solid rgba(0,229,255,.4); background:rgba(10,10,40,.7); color:#00E5FF;
  font-size:20px; cursor:pointer; z-index:20; backdrop-filter:blur(4px);
  box-shadow:0 0 15px rgba(0,229,255,.2); transition:all .3s;
}
.bgm-btn.off { color:rgba(255,255,255,.3); border-color:rgba(255,255,255,.15); box-shadow:none; }
.bgm-btn:active { transform:scale(.9); }

/* ===== 对战舞台 ===== */
.battle-stage {
  position:fixed; inset:0; pointer-events:none; z-index:15; display:none;
  overflow:hidden;
}
.battle-stage.active { display:block; }

/* 超人角色 */
.hero-fighter {
  position:absolute; bottom:10%; left:-120px; width:100px; height:130px;
  transition: none;
}
.hero-fighter svg { width:100%; height:100%; filter:drop-shadow(0 0 15px rgba(0,102,255,.6)); }

/* 怪兽角色 */
.monster {
  position:absolute; bottom:10%; right:-120px; width:110px; height:120px;
  transition: none;
}
.monster svg { width:100%; height:100%; filter:drop-shadow(0 0 15px rgba(139,0,0,.6)); }

/* 超人飞踢动画 */
.hero-fighter.fly-kick {
  animation: hero-fly-kick 1.2s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes hero-fly-kick {
  0% { left:-120px; bottom:10%; transform:rotate(0); }
  30% { left:20%; bottom:50%; transform:rotate(-15deg); }
  60% { left:50%; bottom:30%; transform:rotate(-30deg) scale(1.3); }
  80% { left:55%; bottom:20%; transform:rotate(-20deg) scale(1.1); }
  100% { left:80%; bottom:10%; transform:rotate(0) scale(1); }
}

/* 怪兽被踢飞 */
.monster.hit {
  animation: monster-hit 1.2s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes monster-hit {
  0% { right:-120px; bottom:10%; transform:rotate(0); opacity:1; }
  30% { right:10%; bottom:15%; transform:rotate(5deg); opacity:1; }
  60% { right:35%; bottom:25%; transform:rotate(45deg) scale(.8); opacity:1; }
  80% { right:50%; bottom:40%; transform:rotate(90deg) scale(.5); opacity:.7; }
  100% { right:70%; bottom:60%; transform:rotate(180deg) scale(.2); opacity:0; }
}

/* 怪兽攻击超人 */
.monster.attack {
  animation: monster-attack 1.2s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes monster-attack {
  0% { right:-120px; bottom:10%; transform:rotate(0); }
  30% { right:15%; bottom:25%; transform:rotate(-5deg) scale(1.2); }
  55% { right:35%; bottom:15%; transform:rotate(0) scale(1.4); }
  70% { right:25%; bottom:12%; transform:rotate(5deg) scale(1.1); }
  100% { right:0; bottom:10%; transform:rotate(0) scale(1); }
}

/* 超人被攻击 */
.hero-fighter.hurt {
  animation: hero-hurt 1.2s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes hero-hurt {
  0% { left:30%; bottom:10%; transform:rotate(0); }
  30% { left:20%; bottom:20%; transform:rotate(-15deg); }
  55% { left:10%; bottom:35%; transform:rotate(-30deg) scale(.8); }
  70% { left:5%; bottom:20%; transform:rotate(-10deg) scale(.9); }
  100% { left:-60px; bottom:5%; transform:rotate(0) scale(.85); opacity:.6; }
}

/* 冲击波特效 */
.impact-burst {
  position:absolute; width:60px; height:60px; border-radius:50%;
  background:radial-gradient(circle, #fff, #FFD700, transparent);
  opacity:0; transform:scale(0);
}
.impact-burst.show {
  animation: impact-pop .6s ease-out forwards;
}
@keyframes impact-pop {
  0% { opacity:1; transform:scale(0); }
  50% { opacity:1; transform:scale(2.5); }
  100% { opacity:0; transform:scale(3); }
}

/* KO 文字 */
.ko-text {
  position:absolute; top:25%; left:50%; transform:translate(-50%,-50%);
  font-size:60px; font-weight:900; color:#FFD700;
  text-shadow:0 0 30px #FFD700, 0 0 60px #ff6600, 0 6px 0 #8B0000;
  opacity:0; z-index:20;
  letter-spacing:8px;
}
.ko-text.show {
  animation: ko-pop .8s cubic-bezier(.175,.885,.32,1.275) forwards;
}
@keyframes ko-pop {
  0% { opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-20deg); }
  40% { opacity:1; transform:translate(-50%,-50%) scale(1.4) rotate(5deg); }
  70% { opacity:1; transform:translate(-50%,-50%) scale(.9) rotate(-2deg); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0); }
}

/* 鼓励文字气泡 */
.encourage-bubble {
  position:fixed; bottom:20%; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.85); color:#FFD700; font-size:18px; font-weight:700;
  padding:10px 24px; border-radius:30px; z-index:25;
  border:2px solid #FFD700; opacity:0;
  white-space:nowrap; pointer-events:none;
  box-shadow:0 0 20px rgba(255,215,0,.4);
}
.encourage-bubble.show {
  animation: bubble-up 2s ease-out forwards;
}
@keyframes bubble-up {
  0% { opacity:0; transform:translateX(-50%) translateY(20px); }
  20% { opacity:1; transform:translateX(-50%) translateY(0); }
  80% { opacity:1; transform:translateX(-50%) translateY(-10px); }
  100% { opacity:0; transform:translateX(-50%) translateY(-40px); }
}

</style>
</head>
<body>
<div id="stars"></div>

<!-- 对战舞台 -->
<div class="battle-stage" id="battleStage">
  <div class="hero-fighter" id="heroFighter">
    <svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fbGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0044CC"/><stop offset="50%" stop-color="#0066FF"/><stop offset="100%" stop-color="#003399"/>
        </linearGradient>
        <linearGradient id="frGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E50012"/><stop offset="50%" stop-color="#FF3333"/><stop offset="100%" stop-color="#C8102E"/>
        </linearGradient>
        <linearGradient id="fsGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFF"/><stop offset="100%" stop-color="#A0B0D0"/>
        </linearGradient>
      </defs>
      <polygon points="60,2 50,22 60,18" fill="url(#fsGrad)"/>
      <polygon points="60,2 70,22 60,18" fill="url(#fsGrad)"/>
      <ellipse cx="60" cy="38" rx="24" ry="26" fill="url(#fsGrad)"/>
      <polygon points="44,32 52,29 52,36 44,39" fill="#FFE800"/>
      <polygon points="76,32 68,29 68,36 76,39" fill="#FFE800"/>
      <ellipse cx="60" cy="18" rx="3" ry="5" fill="#00FF88"/>
      <rect x="38" y="62" width="44" height="50" rx="6" fill="url(#fbGrad)"/>
      <path d="M42,64 L60,62 L78,64 L78,88 Q60,95 42,88 Z" fill="url(#frGrad)" opacity=".85"/>
      <rect x="38" y="74" width="44" height="3" fill="url(#fsGrad)"/>
      <circle cx="60" cy="80" r="7" fill="#00E5FF" opacity=".9">
        <animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="14" y="64" width="24" height="14" rx="7" fill="url(#fbGrad)"/>

      <circle cx="38" cy="71" r="8" fill="url(#fsGrad)"/>
      <circle cx="82" cy="71" r="8" fill="url(#fsGrad)"/>
      <rect x="42" y="110" width="16" height="22" rx="4" fill="url(#fbGrad)"/>
      <rect x="62" y="110" width="16" height="22" rx="4" fill="url(#fbGrad)"/>
      <rect x="43" y="118" width="14" height="3" rx="1" fill="url(#frGrad)"/>
      <rect x="63" y="118" width="14" height="3" rx="1" fill="url(#frGrad)"/>
    </svg>
  </div>
  <div class="monster" id="monster">
    <svg viewBox="0 0 130 140" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="mgGrad" cx="50%" cy="30%">
          <stop offset="0%" stop-color="#5a8a3c"/><stop offset="100%" stop-color="#2d4a1e"/>
        </radialGradient>
        <radialGradient id="mbGrad" cx="50%" cy="30%">
          <stop offset="0%" stop-color="#8B4513"/><stop offset="100%" stop-color="#4a2008"/>
        </radialGradient>
      </defs>
      <!-- 怪兽身体 -->
      <ellipse cx="65" cy="80" rx="42" ry="50" fill="url(#mgGrad)"/>
      <!-- 背刺 -->
      <polygon points="40,45 35,20 50,42" fill="#6aaa40"/>
      <polygon points="55,38 52,10 65,36" fill="#6aaa40"/>
      <polygon points="70,38 70,8 80,36" fill="#6aaa40"/>
      <polygon points="85,42 92,15 95,42" fill="#6aaa40"/>
      <!-- 眼睛 -->
      <ellipse cx="50" cy="55" rx="14" ry="16" fill="#FFE800"/>
      <ellipse cx="80" cy="55" rx="14" ry="16" fill="#FFE800"/>
      <ellipse cx="52" cy="56" rx="6" ry="10" fill="#1a1a2e"/>
      <ellipse cx="82" cy="56" rx="6" ry="10" fill="#1a1a2e"/>
      <circle cx="48" cy="52" r="3" fill="#fff" opacity=".8"/>
      <circle cx="78" cy="52" r="3" fill="#fff" opacity=".8"/>
      <!-- 嘴 -->
      <path d="M45,75 Q65,95 85,75" fill="#8B0000" stroke="#4a0000" stroke-width="2"/>

"use strict";
const $ = id => document.getElementById(id);
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- 存档（记忆曲线 SM-2） ---------- */
const SAVE_KEY = "ultra_english_save_v2";
let save = { energy:0, medals:0, planetStars:{}, srs:{} };
try { const s = localStorage.getItem(SAVE_KEY); if (s) save = Object.assign(save, JSON.parse(s)); } catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const BOX_GAP = [0, 30*60e3, 12*3600e3, 24*3600e3, 3*24*3600e3, 7*24*3600e3, 15*24*3600e3];
function srsOf(id){
  if(!save.srs[id]) save.srs[id] = { box:0, due:0, wrong:0, right:0, seen:0 };
  return save.srs[id];
}
function srsAnswer(id, correct){
  const s = srsOf(id);
  s.seen++;
  if(correct){ s.right++; s.box = Math.min(s.box+1, BOX_GAP.length-1); }
  else { s.wrong++; s.box = Math.max(0, s.box>2 ? 1 : 0); }
  s.due = now() + BOX_GAP[s.box];
  persist();
}
function dueReviewWords(){
  return WORD_BANK.filter(w => { const s = save.srs[w.id]; return s && s.seen>0 && (s.due <= now() || s.wrong > s.right); })
    .sort((a,b)=>{ const sa=save.srs[a.id], sb=save.srs[b.id];
      return (sb.wrong - sb.right) - (sa.wrong - sa.right) || sa.due - sb.due; });
}

/* ---------- 甜美女英音 TTS (全平台兼容) ---------- */
let voiceGB = null, voiceUS = null, voiceAny = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  // 甜美女声名匹配(跨平台：Chrome/Safari/微信/Edge)
  const sweet = /serena|moira|fiona|veena|samantha|karen|daniel|alice|ava|emma|olivia|sophie|isabella|mia|charlotte|amelia|harper|evelyn|abigail|emily|elizabeth|sofia|avery|ella|scarlett|grace|chloe|victoria|riley|aria|lily|aurora|zoey|nora|camila|hannah|layla|stella|natalie|zoe|leah|hazel|violet|susan|libby|sonia|kate|amy|lucy|sarah|jessica|jennifer|lisa|michelle|sandra|linda|patricia|barbara|nancy|betty|carol|helen|judy|mary|julia|anna|megan|erin|salli|ivy|joanna|kimberly|kendra|madge|nicole|ruth|tessa/i;
  // 第一优先：英国甜美女声
  voiceGB = vs.find(v=>/en-GB/i.test(v.lang) && sweet.test(v.name))
         || vs.find(v=>/en-GB/i.test(v.lang) && /female/i.test(v.name));
  // 第二优先：美国甜美女声  
  voiceUS = vs.find(v=>/en-US/i.test(v.lang) && sweet.test(v.name))
         || vs.find(v=>/en-US/i.test(v.lang) && /female/i.test(v.name));
  // 兜底：任何英语女声
  voiceAny = vs.find(v=>/^en/i.test(v.lang) && sweet.test(v.name))
          || vs.find(v=>/^en/i.test(v.lang) && /female/i.test(v.name))
          || vs.find(v=>/^en/i.test(v.lang));
  // 综合最佳
  if(!voiceGB && !voiceUS) voiceGB = voiceAny;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text, rate=0.78){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  // 等待voices加载（部分浏览器异步）
  if(!voiceGB && !voiceUS && !voiceAny) pickVoice();
  const u = new SpeechSynthesisUtterance(text);
  // 优选英国→美国→任何英语女声，始终女声
  u.voice = voiceGB || voiceUS || voiceAny || null;
  u.lang = u.voice ? u.voice.lang : "en-GB";
  u.rate = rate;
  u.pitch = 1.25;  // 甜美女声高音
  u.volume = 1;
  speechSynthesis.speak(u);
}

let bgmPlaying = false, bgmGain = null, bgmNodes = [];
const BGM_MELODY = [
  // 前奏 "ジャーン！" (E♭调)
  [0, [523,659,784], 0.15],

  [12.5, [1175,1047,988,784], 0.2],
  [13.5, [659,784,1047,1319], 0.22],
  [14.5, [1568,1319,1047,784], 0.25],
  [15.5, [1047], 0.6],
];

function startBGM() {
  if(bgmPlaying) return;
  bgmPlaying = true;
  const ctx = ac();
  bgmGain = ctx.createGain();
  bgmGain.gain.value = 0.06;
  bgmGain.connect(ctx.destination);
  playBGMLoop();
}

function playBGMLoop() {
  if(!bgmPlaying) return;
  const ctx = ac();
  const now = ctx.currentTime;
  
  BGM_MELODY.forEach(([start, notes, dur]) => {
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = i === 0 ? 'square' : 'triangle';
      o.frequency.value = freq;
      const t = now + start + i * dur;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(bgmGain);
      o.start(t); o.stop(t + dur + 0.05);
      bgmNodes.push(o);
    });
  });
  
  // 打击乐
  for(let beat = 0; beat < 16; beat++) {
    const t = now + beat * 0.5;
    const b = ctx.createOscillator();
    const bg = ctx.createGain();
    b.type = 'triangle';
    b.frequency.value = 80 + (beat % 4 === 0 ? 40 : 0);
    bg.gain.setValueAtTime(0.08, t);
    bg.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    b.connect(bg).connect(bgmGain);
    b.start(t); b.stop(t + 0.12);
    bgmNodes.push(b);
  }
  
  // 循环 (约16秒后)
  bgmNodes.push(setTimeout(() => {
    if(bgmPlaying) playBGMLoop();
  }, 15800));
}

function stopBGM() {
  bgmPlaying = false;
  bgmNodes.forEach(n => { try { if(typeof n === 'number') clearTimeout(n); } catch(e){} });
  bgmNodes = [];
  if(bgmGain) {
    bgmGain.gain.linearRampToValueAtTime(0, ac().currentTime + 0.3);
    setTimeout(() => { try { bgmGain.disconnect(); } catch(e){} }, 400);
  }
}

function toggleBGM() {
  if(bgmPlaying) { stopBGM(); return false; }
  else { startBGM(); return true; }
}

let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC; }
function tone(freq, t0, dur, type="sine", vol=0.25){
  const ctx = ac(), o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t0+dur);
  o.connect(g).connect(ctx.destination);
  o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+dur+0.05);
}

  combo(){ [784,988,1175,1568].forEach((f,i)=>tone(f,i*.07,.18,"square",.12)); },
  win(){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.12,.35,"triangle",.22)); },

/* ---------- Canvas 粒子特效 ---------- */
const cvs = $("fxCanvas"), ctx2 = cvs.getContext("2d");
let parts = [];
function fitCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", fitCanvas); fitCanvas();
function burst(x, y, colors, n=36, spread=9){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = Math.random()*spread+2;
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3, g:.25,
      life:1, decay:.012+Math.random()*.02, size:Math.random()*7+4,
      color: colors[Math.floor(Math.random()*colors.length)],
      shape: Math.random()<.3 ? "star" : "rect", rot:Math.random()*6.28, vr:(Math.random()-.5)*.3 });
  }
}
function drawStarShape(c,x,y,r,rot){
  c.beginPath();
  for(let i=0;i<10;i++){ const rr = i%2? r*.45 : r, a = rot + i*Math.PI/5;
    i? c.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr) : c.moveTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  c.closePath(); c.fill();
}
(function loop(){
  ctx2.clearRect(0,0,cvs.width,cvs.height);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=p.decay; p.rot+=p.vr;
    ctx2.globalAlpha = Math.max(p.life,0); ctx2.fillStyle = p.color;
    if(p.shape==="star") drawStarShape(ctx2,p.x,p.y,p.size,p.rot);
    else { ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.rot); ctx2.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx2.restore(); }
  }
  ctx2.globalAlpha = 1;
  requestAnimationFrame(loop);
})();

/* ---------- 游戏出题 ---------- */
const ROUND_SIZE = 8;
let round = null;

function buildOptions(word){
  const pool = WORD_BANK.filter(w=>w.id!==word.id && w.theme===word.theme);
  const others = shuffle(pool).slice(0,2);
  while(others.length<2){
    const extra = shuffle(WORD_BANK.filter(w=>w.id!==word.id && !others.includes(w)))[0];
    others.push(extra);
  }
  return shuffle([word, ...others]);
}

function startRound(themeKey){
  let words;
  if(themeKey === "__review__"){
    words = dueReviewWords().slice(0, ROUND_SIZE);
    if(!words.length){ alert("太棒了！现在没有需要复习的单词 🎉"); return; }
  } else {
    const pool = WORD_BANK.filter(w=>w.theme===themeKey);
    const scored = pool.map(w=>{ const s = save.srs[w.id];
      let sc = Math.random();
      if(!s || !s.seen) sc += 5;
      else { if(s.wrong>s.right) sc += 8; if(s.due<=now()) sc += 3; }
      return {w, sc};
    }).sort((a,b)=>b.sc-a.sc);
    words = scored.slice(0, ROUND_SIZE).map(x=>x.w);
    words = shuffle(words);
  }
  round = { theme:themeKey, queue:words, idx:0, correct:0, energy:0, combo:0, retry:false };
  show("screen-game");
  $("hudEnergy").textContent = save.energy;
  nextQuestion();
}

function nextQuestion(){
  const r = round;
  if(r.idx >= r.queue.length){ endRound(); return; }
  const word = r.queue[r.idx];
  $("hudBar").style.width = (r.idx / r.queue.length * 100) + "%";
  $("quizQuestion").textContent = word.q;
  $("quizWordBadge").textContent = word.word;
  $("answerLine").innerHTML = "";
  $("comboTip").classList.remove("show");

  // 图片：从外部文件加载（懒加载，首屏秒开）
  const box = $("quizImage");
  box.innerHTML = `<div class="fallback-emoji">${word.emoji}</div>`;
  const im = new Image();
  im.onload = ()=> { box.innerHTML=""; box.appendChild(im); };
  im.onerror = ()=> {}; // keep emoji fallback
  im.src = "img/" + imgKey(word);

  // 选项
  const opts = buildOptions(word);
  const wrap = $("options"); wrap.innerHTML = "";
  const tags = ["A","B","C"];
  opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.innerHTML = `<span class="opt-tag">${tags[i]}</span>${o.word}`;
    b.onclick = ()=> choose(b, o, word);
    wrap.appendChild(b);
  });

  $("btnSpeakQ").onclick = ()=>{ sfx.tap(); speak(word.q); };
  setTimeout(()=> speak(word.q), 350);
}

let locking = false;
function choose(btn, opt, word){
  if(locking) return;
  const correct = opt.id === word.id;
  // 读出所选单词（标准英音）
  const speakText = opt.word === word.word ? (word.say || word.word) : (opt.say || opt.word);
  speak(speakText);

  if(correct){
    locking = true;
    btn.classList.add("correct");
    document.querySelectorAll(".opt-btn").forEach(b=>{ if(b!==btn) b.classList.add("dim"); });
    srsAnswer(word.id, !round.retry);
    round.combo = round.retry ? 0 : round.combo+1;
    if(!round.retry){
      round.correct++;
      const gain = 10 + (round.combo>=3 ? 5:0);
      round.energy += gain; save.energy += gain; persist();
      $("hudEnergy").textContent = save.energy;
    }
    sfx.right();
    const rect = btn.getBoundingClientRect();
    burst(rect.left+rect.width/2, rect.top+rect.height/2, ULTRA_COLORS, 40);
    
    // 超人vs怪兽对战动画 (鼓励语在动画内部播放)
    playBattleAnimation(true);
    
    if(round.combo>=2 && !round.retry){
      sfx.combo();
      const tip = $("comboTip");
      tip.textContent = `⚡ 连击 x${round.combo}！赛罗双重射线！`;
      tip.classList.add("show");
      if(round.combo>=3){ $("beamFx").classList.add("on"); sfx.beam();
        setTimeout(()=>$("beamFx").classList.remove("on"), 600); }
    }
    // 显示答案 — 答案语音延迟到鼓励语之后
    $("answerLine").innerHTML = `✅ <span class="listen">${word.a} 🔊</span>`;
    $("answerLine").querySelector(".listen").onclick = ()=> speak(word.a);
    // 答案朗读延迟到2.5s后（等鼓励语读完）
    setTimeout(()=> speak(word.a), 2500);
    setTimeout(()=>{ locking=false; round.retry=false; round.idx++; nextQuestion(); }, 3500);
  } else {
    btn.classList.add("wrong");
    setTimeout(()=>btn.classList.add("dim"), 400);
    sfx.wrong();
    
    // 怪兽攻击超人动画
    playBattleAnimation(false);
    
    if(!round.retry){ srsAnswer(word.id, false); }
    round.retry = true; round.combo = 0;
    $("answerLine").innerHTML = `💪 再试一次！Try again!`;
  }
}

/* ---------- 结算 ---------- */
function endRound(){
  const r = round;
  $("hudBar").style.width = "100%";
  const ratio = r.correct / r.queue.length;
  const stars = ratio >= 0.99 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
  if(r.theme !== "__review__"){
    if(stars > (save.planetStars[r.theme]||0)) save.planetStars[r.theme] = stars;
  }
  if(stars===3){ save.medals++; }
  persist();

  $("rsCorrect").textContent = `${r.correct}/${r.queue.length}`;
  $("rsEnergy").textContent = "+" + r.energy;
  $("resultTitle").textContent = stars===3 ? "🏆 完美通关！" : stars>=1 ? "✨ 闯关成功！" : "💪 再接再厉！";
  $("resultStars").innerHTML = [0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join("");
  const dueN = dueReviewWords().length;
  $("resultMsg").textContent = stars===3
    ? "你获得了一枚光之勋章！所有怪兽都被打败了！"
    : (dueN? `还有 ${dueN} 个单词怪兽等你消灭哦～` : "继续出征，收集更多光之能量吧！");
  show("screen-result");
  sfx.win();
  speak(stars===3 ? "Perfect! You are a true hero!" : stars>=1 ? "Well done! Keep fighting!" : "Keep trying! You can do it!", 0.75);
  let k = 0;
  const timer = setInterval(()=>{
    burst(Math.random()*innerWidth, Math.random()*innerHeight*0.5, ULTRA_COLORS, 30);
    if(++k>=(stars+1)*2) clearInterval(timer);
  }, 300);
  refreshHome();
}

/* ---------- 事件绑定 ---------- */
$("btnStart").onclick = ()=>{ ac(); sfx.tap(); renderPlanets(); show("screen-planets"); };
$("btnReview").onclick = ()=>{ ac(); sfx.tap(); startRound("__review__"); };
$("btnBackHome").onclick = ()=>{ sfx.tap(); refreshHome(); show("screen-home"); };
$("btnQuit").onclick = ()=>{ speechSynthesis.cancel(); refreshHome(); show("screen-home"); };
$("btnNext").onclick = ()=>{ sfx.tap(); renderPlanets(); show("screen-planets"); };

$("btnResultHome").onclick = ()=>{ sfx.tap(); refreshHome(); show("screen-home"); };

// BGM开关
$("bgmToggle").onclick = (e) => {
  e.stopPropagation();
  const on = toggleBGM();
  $("bgmToggle").textContent = on ? "🎵" : "🔇";
  $("bgmToggle").classList.toggle("off", !on);
};
</script>

<button class="bgm-btn" id="bgmToggle" title="BGM开关">🎵</button>
</body>
